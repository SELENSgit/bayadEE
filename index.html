<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BayadEE - Student Balance Portal</title>
  <style>
    :root {
      --yellow: #ffff00;
      --black: #000000;
      --white: #ffffff;
    }

    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
    }
    
    body { 
      background-color: var(--black); 
      color: var(--white); 
      padding: 2rem 1rem; 
    }

    .container { 
      max-width: 650px; 
      margin: 0 auto; 
    }
    
    header { 
      text-align: center; 
      margin-bottom: 2rem; 
    }

    .org-logo {
      width: 90px;
      height: 90px;
      object-fit: contain;
      margin-bottom: 1rem;
    }
    
    header h1 { 
      color: var(--yellow); 
      font-size: 2.25rem; 
      margin-bottom: 0.5rem; 
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    
    header p { 
      color: var(--white); 
    }

    .search-card { 
      background: var(--black); 
      padding: 1.5rem; 
      border-radius: 12px; 
      margin-bottom: 1.5rem; 
      border: 2px solid var(--yellow); 
    }

    .form-group { 
      display: flex; 
      gap: 0.75rem; 
    }

    input { 
      flex: 1; 
      padding: 0.75rem 1rem; 
      background: var(--black);
      color: var(--white);
      border: 1px solid var(--white); 
      border-radius: 8px; 
      font-size: 1rem; 
      outline: none; 
      transition: border 0.2s; 
    }

    input:focus { 
      border-color: var(--yellow); 
    }

    button { 
      background: var(--yellow); 
      color: var(--black); 
      border: none; 
      padding: 0.75rem 1.5rem; 
      border-radius: 8px; 
      font-weight: 700; 
      cursor: pointer; 
      text-transform: uppercase;
      transition: opacity 0.2s; 
    }

    button:hover { 
      opacity: 0.85; 
    }

    .result-view { 
      display: none; 
    }

    .profile-banner { 
      display: flex; 
      justify-content: space-between; 
      align-items: flex-start; 
      margin-bottom: 1.5rem; 
      border-bottom: 1px solid var(--yellow);
      padding-bottom: 1rem;
    }

    .profile-banner h2 { 
      font-size: 1.5rem; 
      color: var(--yellow);
    }

    .profile-banner p { 
      color: var(--white); 
      font-size: 0.9rem; 
      margin-top: 0.25rem; 
    } 
    
    .badge-balance { 
      background: var(--yellow); 
      color: var(--black); 
      padding: 0.5rem 1rem; 
      border-radius: 20px; 
      font-weight: 800; 
      font-size: 1.1rem; 
    }

    .badge-balance.clear { 
      background: var(--white); 
      color: var(--black); 
    }

    .fine-item { 
      background: var(--black); 
      border: 1px solid var(--white); 
      padding: 1.25rem; 
      border-radius: 10px; 
      margin-bottom: 1rem; 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
    }

    .fine-info h4 { 
      font-size: 1.1rem; 
      color: var(--yellow);
      margin-bottom: 0.25rem; 
    }

    .fine-info p { 
      color: var(--white); 
      font-size: 0.85rem; 
    } 
    
    .status-tag { 
      padding: 0.25rem 0.75rem; 
      border-radius: 6px; 
      font-size: 0.85rem; 
      font-weight: 700; 
      text-transform: uppercase; 
      border: 1px solid var(--yellow);
      color: var(--yellow);
      background: var(--black);
    }

    .status-tag.paid { 
      border-color: var(--white);
      color: var(--white);
    }

    .error-msg { 
      color: var(--yellow); 
      background: var(--black); 
      padding: 1rem; 
      border-radius: 8px; 
      border: 1px solid var(--yellow); 
      text-align: center; 
      display: none; 
    }

    .loading { 
      text-align: center; 
      color: var(--yellow); 
      display: none; 
      padding: 2rem; 
      font-weight: 600;
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <img src="org-logo.png" alt="Organization Logo" class="org-logo">
    <h1>BayadEE Portal</h1>
    <p>Check your clearances, financial obligations, and event fines instantly.</p>
  </header>

  <div class="search-card">
    <div class="form-group">
      <input type="text" id="studentIdInput" placeholder="Enter Student ID (e.g., 2023-4779)" autocomplete="off">
      <button onclick="searchStudent()">Search</button>
    </div>
  </div>

  <div id="loadingState" class="loading">Searching ledger records...</div>
  <div id="errorState" class="error-msg"></div>

  <div id="resultState" class="result-view">
    <div class="profile-banner">
      <div>
        <h2 id="studentName">Student Name</h2>
        <p id="studentMetadata">ID Info</p>
        <p id="studentEmail" style="color: var(--yellow)"></p>
      </div>
      <div id="outstandingBalance" class="badge-balance">₱0.00</div>
    </div>

    <h3 style="color: var(--yellow); margin-bottom: 0.5rem;">Fines & Obligations Breakdown</h3>
    <div id="finesContainer" style="margin-top: 1rem;"></div>
  </div>
</div>

<script>
  // Paste your Apps Script Web App Exec URL here
  const API_URL = 'https://script.google.com/macros/s/AKfycbw2bXTwUKEFaGwobo7bsTWiJI8mKOhCFWTxdgZO0kfNB8y2UdGtDWC_xzPOPg4V6WThkQ/exec';

  async function searchStudent() {
    const studentId = document.getElementById('studentIdInput').value.trim();
    const loadingState = document.getElementById('loadingState');
    const errorState = document.getElementById('errorState');
    const resultState = document.getElementById('resultState');
    const finesContainer = document.getElementById('finesContainer');

    if (!studentId) return alert('Please key in a Student ID first.');

    loadingState.style.display = 'block';
    errorState.style.display = 'none';
    resultState.style.display = 'none';
    finesContainer.innerHTML = '';

    try {
      const response = await fetch(`${API_URL}?id=${encodeURIComponent(studentId)}`);
      if (!response.ok) throw new Error('Failed to retrieve records.');

      const rows = await response.json();

      if (rows.error) throw new Error(rows.error);
      if (!rows || rows.length === 0) throw new Error('Student ID not found in current records.');

      // 1. Student Info from first row
      const firstRow = rows[0];
      document.getElementById('studentName').innerText = firstRow['Full Name'] || 'N/A';
      document.getElementById('studentMetadata').innerText = `Student ID: ${studentId}`;
      document.getElementById('studentEmail').innerText = firstRow['Email Address'] || '';

      let totalPending = 0;

      // 2. Loop through matching entries
      rows.forEach(row => {
        const rawAmount = String(row['Fine Amount'] || '0').replace(/[^\d.]/g, '');
        const amount = parseFloat(rawAmount) || 0;
        const status = String(row['Status'] || 'Pending').trim();

        if (status.toLowerCase() !== 'paid') {
          totalPending += amount;
        }

        const dateStr = row['Date'] ? String(row['Date']).split('T')[0] : 'N/A';

        const item = document.createElement('div');
        item.className = 'fine-item';
        item.innerHTML = `
          <div class="fine-info">
            <h4>${row['Event / Offense'] || 'Obligation'}</h4>
            <p>Date: ${dateStr} • TXN ID: <strong>${row['TXN ID'] || 'N/A'}</strong></p>
            <p style="margin-top:4px; font-weight:700; color: var(--white)">Amount: ₱${amount.toFixed(2)}</p>
          </div>
          <div>
            <span class="status-tag ${status.toLowerCase()}">${status}</span>
          </div>
        `;
        finesContainer.appendChild(item);
      });

      // 3. Render Total Outstanding Balance
      const balanceBadge = document.getElementById('outstandingBalance');
      if (totalPending === 0) {
        balanceBadge.classList.add('clear');
        balanceBadge.innerText = 'Cleared';
      } else {
        balanceBadge.classList.remove('clear');
        balanceBadge.innerText = `₱${totalPending.toFixed(2)}`;
      }

      resultState.style.display = 'block';
    } catch (err) {
      errorState.innerText = err.message;
      errorState.style.display = 'block';
    } finally {
      loadingState.style.display = 'none';
    }
  }
</script>
</body>
</html>
